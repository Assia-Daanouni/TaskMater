<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendrier Intéractif</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --primary: #4361ee;
      --primary-light: #4895ef;
      --secondary: #3f37c9;
      --dark: #1b263b;
      --light: #f8f9fa;
      --gray: #6c757d;
      --success: #4bb543;
      --warning: #ffc107;
      --danger: #dc3545;
      --border-radius: 12px;
      --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --transition: all 0.3s ease;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f7fa;
      color: var(--dark);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem;
      min-height: 100vh;
    }
    
    .calendar-container {
      background-color: white;
      box-shadow: var(--box-shadow);
      border-radius: var(--border-radius);
      padding: 1.5rem;
      width: 100%;
      max-width: 800px;
      transition: var(--transition);
    }
    
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      position: relative;
    }
    
    .month-year {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--dark);
      text-transform: capitalize;
    }
    
    .nav-button {
      background-color: var(--primary);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .nav-button:hover {
      background-color: var(--secondary);
      transform: translateY(-2px);
    }
    
    .calendar-tools {
      display: flex;
      gap: 0.5rem;
      position: absolute;
      right: 0;
      top: 0;
    }
    
    .today-button {
      background-color: var(--light);
      color: var(--dark);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .today-button:hover {
      background-color: var(--primary-light);
      color: white;
    }
    
    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 500;
      color: var(--gray);
    }
    
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
    }
    
    .day-cell {
      aspect-ratio: 1;
      padding: 0.75rem;
      border-radius: 8px;
      background-color: white;
      border: 1px solid rgba(0,0,0,0.05);
      transition: var(--transition);
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    
    .day-cell:hover {
      background-color: var(--light);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    
    .day-number {
      font-weight: 500;
      margin-bottom: 0.25rem;
      align-self: flex-end;
    }
    
    .current-day {
      background-color: var(--primary-light) !important;
      color: white;
    }
    
    .current-day .day-number {
      font-weight: 600;
    }
    
    .other-month {
      color: #ccc;
      background-color: #f9f9f9;
    }
    
    .event-indicator {
      width: 6px;
      height: 6px;
      background-color: var(--success);
      border-radius: 50%;
      align-self: center;
      margin-top: auto;
    }
    
    .event-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }
    
    .event-item {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      margin-top: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .work-event { background-color: rgba(67, 97, 238, 0.1); color: var(--primary); }
    .personal-event { background-color: rgba(75, 181, 67, 0.1); color: var(--success); }
    .important-event { background-color: rgba(220, 53, 69, 0.1); color: var(--danger); }
    
    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    
    .modal-content {
      background-color: white;
      padding: 2rem;
      border-radius: var(--border-radius);
      width: 90%;
      max-width: 500px;
      box-shadow: 0 5px 30px rgba(0,0,0,0.2);
      position: relative;
    }
    
    .close-button {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--gray);
    }
    
    .event-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .form-group label {
      font-weight: 500;
    }
    
    .form-control {
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: 'Poppins', sans-serif;
    }
    
    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .btn-primary {
      background-color: var(--primary);
      color: white;
    }
    
    .btn-primary:hover {
      background-color: var(--secondary);
    }
    
    .event-type-selector {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    
    .event-type {
      flex: 1;
      padding: 0.5rem;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: var(--transition);
    }
    
    .event-type.selected {
      border-color: var(--primary);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      body {
        padding: 1rem;
        align-items: flex-start;
      }
      
      .calendar-container {
        padding: 1rem;
      }
      
      .month-year {
        font-size: 1.25rem;
      }
      
      .event-item {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="calendar-container">
    <div class="calendar-header">
      <div class="calendar-tools">
        <button class="today-button" id="todayBtn">
          <i class="fas fa-calendar-day"></i>
          Aujourd'hui
        </button>
      </div>
      <button class="nav-button" id="prevBtn">
        <i class="fas fa-chevron-left"></i>
      </button>
      <h2 class="month-year" id="monthYear"></h2>
      <button class="nav-button" id="nextBtn">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>
    
    <div class="calendar-days">
      <div>Dim</div>
      <div>Lun</div>
      <div>Mar</div>
      <div>Mer</div>
      <div>Jeu</div>
      <div>Ven</div>
      <div>Sam</div>
    </div>
    
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>
  
  <!-- Event Modal -->
  <div class="modal" id="eventModal">
    <div class="modal-content">
      <span class="close-button" id="closeModal">&times;</span>
      <h3 id="modalTitle">Ajouter un Événement</h3>
      <div class="event-form">
        <div class="event-type-selector">
          <div class="event-type selected" data-type="work">
            <i class="fas fa-briefcase"></i> Travail
          </div>
          <div class="event-type" data-type="personal">
            <i class="fas fa-user"></i> Personnel
          </div>
          <div class="event-type" data-type="important">
            <i class="fas fa-exclamation"></i> Important
          </div>
        </div>
        <div class="form-group">
          <label for="eventTitle">Titre</label>
          <input type="text" id="eventTitle" class="form-control" placeholder="Nom de l'événement">
        </div>
        <div class="form-group">
          <label for="eventDate">Date</label>
          <input type="date" id="eventDate" class="form-control">
        </div>
        <div class="form-group">
          <label for="eventDescription">Description (optionnel)</label>
          <textarea id="eventDescription" class="form-control" rows="3" placeholder="Détails..."></textarea>
        </div>
        <button class="btn btn-primary" id="saveEvent">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Elements
      const monthYearElement = document.getElementById('monthYear');
      const calendarGrid = document.getElementById('calendarGrid');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const todayBtn = document.getElementById('todayBtn');
      const eventModal = document.getElementById('eventModal');
      const closeModal = document.getElementById('closeModal');
      const saveEventBtn = document.getElementById('saveEvent');
      const eventTitleInput = document.getElementById('eventTitle');
      const eventDateInput = document.getElementById('eventDate');
      const eventDescriptionInput = document.getElementById('eventDescription');
      const eventTypes = document.querySelectorAll('.event-type');
      
      // Current date
      let currentDate = new Date();
      let currentMonth = currentDate.getMonth();
      let currentYear = currentDate.getFullYear();
      let selectedDate = null;
      let selectedEventType = 'work';
      let events = JSON.parse(localStorage.getItem('calendarEvents')) || [];
      
      // Initialize calendar
      function initCalendar() {
        updateMonthYear();
        renderCalendar();
      }
      
      // Update month and year display
      function updateMonthYear() {
        const options = { month: 'long', year: 'numeric' };
        monthYearElement.textContent = new Date(currentYear, currentMonth).toLocaleDateString('fr-FR', options);
      }
      
      // Render calendar grid
      function renderCalendar() {
        calendarGrid.innerHTML = '';
        
        const firstDayOfMonth = new Date(currentYear, currentMonth, 1);
        const lastDayOfMonth = new Date(currentYear, currentMonth + 1, 0);
        const daysInMonth = lastDayOfMonth.getDate();
        const startingDay = firstDayOfMonth.getDay();
        
        // Previous month days
        const prevMonthLastDay = new Date(currentYear, currentMonth, 0).getDate();
        for (let i = 0; i < startingDay; i++) {
          const day = prevMonthLastDay - startingDay + i + 1;
          const dayElement = createDayElement(day, true);
          calendarGrid.appendChild(dayElement);
        }
        
        // Current month days
        const today = new Date();
        for (let day = 1; day <= daysInMonth; day++) {
          const dayElement = createDayElement(day, false);
          
          // Highlight current day
          if (day === today.getDate() && 
              currentMonth === today.getMonth() && 
              currentYear === today.getFullYear()) {
            dayElement.classList.add('current-day');
          }
          
          // Add events indicators
          const dateStr = `${currentYear}-${(currentMonth + 1).toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
          const dayEvents = events.filter(event => event.date === dateStr);
          
          if (dayEvents.length > 0) {
            const eventIndicators = document.createElement('div');
            eventIndicators.className = 'day-events';
            
            dayEvents.forEach(event => {
              const eventDot = document.createElement('span');
              eventDot.className = `event-dot ${event.type}-dot`;
              eventIndicators.appendChild(eventDot);
              
              // For larger screens, show event titles
              if (window.innerWidth > 768) {
                const eventItem = document.createElement('div');
                eventItem.className = `event-item ${event.type}-event`;
                eventItem.textContent = event.title;
                eventIndicators.appendChild(eventItem);
              }
            });
            
            dayElement.appendChild(eventIndicators);
          }
          
          calendarGrid.appendChild(dayElement);
        }
        
        // Next month days
        const totalCells = startingDay + daysInMonth;
        const remainingCells = 42 - totalCells; // 6 rows x 7 days
        
        if (remainingCells > 0) {
          for (let i = 1; i <= remainingCells; i++) {
            const dayElement = createDayElement(i, true);
            calendarGrid.appendChild(dayElement);
          }
        }
      }
      
      // Create day element
      function createDayElement(day, isOtherMonth) {
        const dayElement = document.createElement('div');
        dayElement.className = `day-cell ${isOtherMonth ? 'other-month' : ''}`;
        
        const dayNumber = document.createElement('div');
        dayNumber.className = 'day-number';
        dayNumber.textContent = day;
        dayElement.appendChild(dayNumber);
        
        // Store full date as data attribute
        const date = new Date(currentYear, isOtherMonth ? 
                      (day > 15 ? currentMonth - 1 : currentMonth + 1) : currentMonth, day);
        const dateStr = date.toISOString().split('T')[0];
        dayElement.dataset.date = dateStr;
        
        // Add click event
        dayElement.addEventListener('click', function() {
          selectedDate = dateStr;
          openEventModal(dateStr);
        });
        
        return dayElement;
      }
      
      // Navigation
      prevBtn.addEventListener('click', function() {
        currentMonth--;
        if (currentMonth < 0) {
          currentMonth = 11;
          currentYear--;
        }
        updateMonthYear();
        renderCalendar();
      });
      
      nextBtn.addEventListener('click', function() {
        currentMonth++;
        if (currentMonth > 11) {
          currentMonth = 0;
          currentYear++;
        }
        updateMonthYear();
        renderCalendar();
      });
      
      todayBtn.addEventListener('click', function() {
        currentDate = new Date();
        currentMonth = currentDate.getMonth();
        currentYear = currentDate.getFullYear();
        updateMonthYear();
        renderCalendar();
      });
      
      // Event Modal
      function openEventModal(dateStr) {
        const date = new Date(dateStr);
        eventDateInput.value = dateStr;
        document.getElementById('modalTitle').textContent = `Événement pour le ${date.toLocaleDateString('fr-FR')}`;
        eventTitleInput.value = '';
        eventDescriptionInput.value = '';
        selectedEventType = 'work';
        updateEventTypeSelection();
        eventModal.style.display = 'flex';
      }
      
      closeModal.addEventListener('click', function() {
        eventModal.style.display = 'none';
      });
      
      window.addEventListener('click', function(e) {
        if (e.target === eventModal) {
          eventModal.style.display = 'none';
        }
      });
      
      // Event type selection
      eventTypes.forEach(type => {
        type.addEventListener('click', function() {
          selectedEventType = this.dataset.type;
          updateEventTypeSelection();
        });
      });
      
      function updateEventTypeSelection() {
        eventTypes.forEach(type => {
          type.classList.toggle('selected', type.dataset.type === selectedEventType);
        });
      }
      
      // Save event
      saveEventBtn.addEventListener('click', function() {
        const title = eventTitleInput.value.trim();
        const date = eventDateInput.value;
        const description = eventDescriptionInput.value.trim();
        
        if (!title) {
          alert('Veuillez entrer un titre pour l\'événement');
          return;
        }
        
        const newEvent = {
          id: Date.now(),
          title,
          date,
          description,
          type: selectedEventType
        };
        
        events.push(newEvent);
        saveEvents();
        renderCalendar();
        eventModal.style.display = 'none';
      });
      
      // Save events to localStorage
      function saveEvents() {
        localStorage.setItem('calendarEvents', JSON.stringify(events));
      }
      
      // Initialize
      initCalendar();
    });
  </script>
</body>
</html>
